- type: entity
  id: GaslokalkaLegacyMemorial
  parent: BaseStructure
  name: Мемориал Gaslokalka Legacy
  description: Мемориал Gaslokalka Legacy, то есть билд 06.2026, до удаления треков..
  components:
  - type: Sprite
    sprite: _SpyStation/Structures/Furniture/Memorials/gaslokalka_legacy_memorial.rsi
    state: gaslokalka_legacy_memorial
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.20"
        density: 85
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: InteractionOutline

